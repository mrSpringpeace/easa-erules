# FAA source catalog — 14 CFR parts served by the public eCFR API.
#
# EXPERIMENTAL. EASA is the maintained branch of this project; the FAA branch
# exists because public-domain text over a structured API is cheap to support.
# It mirrors regulation text only and is not a source for the FAA certification
# basis.
#
# 14 CFR is US Government work in the public domain, and eCFR publishes it as
# structured XML, so this branch needs neither OOXML parsing nor the licensing
# care the EASA branch does.
#
# Fetch URLs are built from the eCFR versioner API rather than a landing page:
#   https://www.ecfr.gov/api/versioner/v1/full/{date}/title-14.xml?part={part}

sources:

  far-21:
    title: "Certification Procedures for Products and Articles (14 CFR 21)"
    authority: "FAA"
    type: "regulation"
    aliases:
      - 14CFR21
      - part-21-faa
      - far21
    ecfr:
      title: 14
      part: "21"
    preferred_format: xml

  far-23:
