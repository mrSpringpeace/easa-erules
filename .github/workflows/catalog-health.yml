name: Catalog health

# The landing-page resolver is the most fragile link in the chain: EASA
# restructures its document library from time to time and the failure is silent
# until someone tries to fetch. This job watches every catalog entry and reports
# drift as an artifact — it never fails the build, so a website change does not
# turn the main CI red for everyone.
#
# It runs --deep: resolve, download and parse. A resolver that finds *a*
# publication proves nothing — CS-ETSO resolved happily for months and handed
# back a PDF labelled as the XML export. Roughly 70 MB and 10-20 minutes.
#
# Since 2026-11-06 it also reads EASA's publication-history.xml once and flags
# an entry as drift when the resolver had to fall back to the landing page,
# when the catalog's format claim disagrees with the history (CS-ETSO gained
# XML with Amdt 17 and nothing noticed), or when the landing page's latest XML
# names a different version than the history's.
#
# Drift now reaches a person: scripts/drift_issue.py opens one issue labelled
# catalog-drift (comments on it while drift persists, closes it when clean).
#
# Keepalive: GitHub disables scheduled workflows in a public repository after
# 60 days without activity. That happened here: "Live EASA smoke" was found
# disabled_inactivity on 2026-11-06, and catalog health had not run since
# 2026-10-19. In maintenance mode nobody commits, so the job re-enables both
# workflows through the API on every run (the method keepalive-workflow v2
# documents for resetting the inactivity timer without commits).

on:
  workflow_dispatch:
  schedule:
    # Mondays 05:30 UTC, before the live smoke
    - cron: "30 5 * * 1"

permissions:
  contents: read
  issues: write    # drift_issue.py
  actions: write   # keepalive: re-enable scheduled workflows

jobs:
  check-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Probe every catalog entry
        id: probe
        continue-on-error: true
        run: python scripts/catalog_health.py --deep --output catalog-health.json

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalog-health
          path: catalog-health.json
          if-no-files-found: warn

      - name: Open, update or close the drift issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          python scripts/drift_issue.py catalog-health.json
          --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Keep scheduled workflows alive
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for workflow in catalog-health.yml live-smoke.yml; do
            gh api -X PUT "repos/${{ github.repository }}/actions/workflows/$workflow/enable"
          done

      - name: Summary
        if: always()
        run: |
          if [ -f catalog-health.json ]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          report = json.load(open("catalog-health.json"))
          mode = "deep" if report.get("deep") else "resolve-only"
          print(f"## Catalog health ({mode}) — {report['ok']}/{report['total']} ok\n")
          print("| Source | Authority | Status | Detail |")
          print("|--------|-----------|--------|--------|")
          for entry in report["entries"]:
              print(
                  f"| `{entry['id']}` | {entry['authority']} | {entry['status']} "
                  f"| {entry.get('detail', '')} |"
              )
          PY
          fi
